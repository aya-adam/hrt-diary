gesdinet_jwt_refresh_token:
    refresh_token_class: App\Entity\RefreshTokenEntity
    token_parameter_name: '%app.jwt_refresh_token_cookie_name%'
    ttl: 604800  # 7 days
    cookie:
        enabled: true
        same_site: strict
        path: '%app.jwt_refresh_token_cookie_path%'
        domain: null
        http_only: true
        secure: true
        partitioned: false
        remove_token_from_body: true