api_platform:
    title: HRT Diary API
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        pagination_enabled: false
        collectDenormalizationErrors: true
    graphql:
        introspection: false
        graphiql:
            enabled: false
        graphql_playground:
            enabled: false
        collection:
            pagination:
                enabled: false

when@dev:
    api_platform:
        graphql:
            introspection: true
            graphiql:
                enabled: true
            graphql_playground:
                enabled: true